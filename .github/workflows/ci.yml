name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes its running check. Each main commit gets a group of its own, so none of main's runs is cancelled or displaced: Deploy Game Lab follows every one.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Committed line endings are LF
        run: |
          crlf="$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed"')"
          if [ -n "$crlf" ]; then echo "::error::These files are committed with CRLF line endings; renormalise them (git add --renormalize .):"; echo "$crlf"; exit 1; fi
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
