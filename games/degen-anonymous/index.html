<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Degen Anonymous — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <div class="stage"><canvas aria-label="A church basement on a Thursday: fluorescent tubes, one flickering, over cinderblock walls painted a tired green, a DEGEN ANONYMOUS banner over a cloth reading WE ARE POWERLESS OVER THE CHART on two pins, a folding table of supermarket cookies, a podium with a big book of grievances, a coffee urn steaming in the corner and a TV on a cart showing the chart nobody mentions, and twelve folding chairs in a circle: Terry the sponsor with a cup of snacks, Big Ron checking his watch, the nurse, the guitar guy, the podcast guy with a mic, the guy who sold the stock, the vegan, the cookie guy, the twins who speak in alternating words, your own chair seen from behind with a YOU tag, and Jules, whose nametag flips from 12 DAYS to 3 to DAY 0 as his thumb hovers over the BUY button on his phone; every share is keyed to the round multiplier and the room leans in toward him while the TV grows; cashing out stands you up to say you took profits, fold your chair and go, and the crash is his thumb coming down on BOUGHT THE TOP, every chair up at once, the urn pouring a puddle to his shoe, Big Ron flat on his back, the banner coming down one pin at a time onto the cookies, and the whole circle in a group hug on the floor."></canvas></div>
    <div class="controls">
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out · take profits, fold your chair</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
