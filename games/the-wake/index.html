<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Wake — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <div class="stage"><canvas aria-label="A funeral parlor at half past four for Gerald “Big Bagz” Holdern, who never sold: late light through venetian blinds, a casket closed to view but for his folded hands around a glowing phone whose battery drains as the round climbs, a Crypto Celebrant whose eulogy deepens with the multiplier while his hands rise off an empty ledger, a widow gripping Gerald’s folded lawn chair as her veil trembles, a son running a chart overlay, a best friend who sold at 1.4×, mourners glancing at phones, a guest book turning its own pages and gravediggers stopping to watch; cashing out slips your cousin out of the side door with two sandwiches and the candle into a rideshare plated TOOK PROFIT, and the crash is a DEV SOLD notification that darkens the portrait’s laser eyes, turns every wreath ribbon to RUGGED and sits the widow on the lawn chair at the foot of the casket."></canvas></div>
    <div class="controls">
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out · slip out the side door</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
