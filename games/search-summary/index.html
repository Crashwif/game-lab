<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Summary — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <canvas aria-label="Search Summary: A glowing AI search card stretches across the browser canvas while incinerating sponsored click banners. Cashing out cashes out ad royalties before the algorithmic nonsense spreads. Crashing shows the stock ticker falling off a cliff as the query recommends glue on pizza."></canvas>
    <div class="controls">
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
