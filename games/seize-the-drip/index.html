<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seize the Drip — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <canvas aria-label="Seize the Drip. A fictional Paris boutique, an increasingly overdressed revolutionary, the round multiplier and your participation status. Choose the next luxury item with the buttons below or keys 1 to 4. Cash out before the host reveals a crash."></canvas>
    <div class="controls">
      <div class="loot-choices" role="group" aria-label="Choose your next redistribution">
        <span id="loot-help">Choose the loot <span class="key-hint">· keys 1–4</span></span>
        <button id="loot-bag" class="loot" aria-pressed="false" aria-keyshortcuts="1">Bag</button>
        <button id="loot-watch" class="loot" aria-pressed="false" aria-keyshortcuts="2">Watch</button>
        <button id="loot-shoe" class="loot" aria-pressed="false" aria-keyshortcuts="3">Trainers</button>
        <button id="loot-coat" class="loot" aria-pressed="false" aria-keyshortcuts="4">Coat</button>
        <button id="loot-auto" class="loot" aria-pressed="true" aria-keyshortcuts="0">Auto</button>
      </div>
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
    <p id="story" class="story-caption" aria-live="polite"></p>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
