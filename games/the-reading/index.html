<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Reading — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <div class="stage"><canvas aria-label="A wood-panelled study at four in the afternoon with rain on the window: Peterson the family lawyer reads Grandma Margaret Holdern's will to the family around a mahogany table while her portrait's eyes follow the reading and the fire burns lower, and every bequest (the house, the service for twelve, the bags, the leased car, the chatbot grandmother, the timeshare, the washed hoodie) lands on the table and melts as the round multiplier climbs, watched only by the nephew whose phone shows the one chart in the room; cashing out accepts item fourteen and you walk out with the will, and the crash is the lawyer's filing that stamps everything COLLATERAL, drops the doily off the sampler, closes Grandma's eyes, opens the freezer on a frozen dip and takes the walls off around Gerald the deer head until the will is a receipt."></canvas></div>
    <div class="controls">
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out · take the will and go</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
