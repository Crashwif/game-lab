<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clickbait Curse — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <canvas aria-label="Clickbait Curse: A sweaty creator fights to maintain a hyper-edited shocked face thumbnail while YouTube's random frame selector rolls through hideous unflattering pauses. Cash out to publish a 10/10 viral banger and bank the viewcount. Crash out and the algorithm locks in a cursed double-chin mid-blink frame forever."></canvas>
    <div class="controls">
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
