<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gender Reveal — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <div class="stage"><canvas aria-label="A sunny backyard gender reveal that is secretly a token launch: Sheila runs the programme by megaphone and clipboard beside a white reveal box with a latch, Tanner in jorts and Destiny in a MAMA TO BE sash flank it, Grandpa Hal clutches the key on its DEV keychain, a question-mark piñata nobody hung ticks faster as the round gets older, the two-tier cake separates into pink and blue, two grandmothers grip one plate in a stalemate, Kyle in scrubs works a laptop under the dessert table, the family group chat on the garage door degrades from so excited to question marks, and the crash opens the box on a phone reading $BABY IS LIVE and a fog machine while the piñata turns out to be a sell button, receipts snow on the folding chairs, the banner falls to WAGMI and Kyle goes over the fence; cashing out sends your plus-one through the side gate with the last slice of cake wrapped like a burrito."></canvas></div>
    <div class="controls">
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out · take the last slice</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
