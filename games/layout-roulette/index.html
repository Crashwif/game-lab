<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout Roulette — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <canvas aria-label="Layout Roulette: A sweaty interior designer shifts walls back and forth on a 3D blueprint as the toilet moves into the pantry and the shower wraps around the stove. Cashing out locks the deed on a mildly livable duplex and snaps tape measure in triumph. Crashing collapses the drywall stack into a dusty heap of broken ceramic tiles and open plumbing."></canvas>
    <div class="controls">
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
