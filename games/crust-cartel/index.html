<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crust Cartel — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <canvas aria-label="Crust Cartel: Dough flings across a cramped kitchen as thousands of desperate foodies storm the apartment stairs. Cash out to slide your slice into a takeout box and slip out the fire escape. Crash and your toaster-oven exploded under heavy marinara crossfire."></canvas>
    <div class="controls">
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
