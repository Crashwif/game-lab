<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Congressional Hearing — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <div class="stage"><canvas aria-label="A wood-panelled committee hearing where five senators in seniority order, Chairman Marcus with his gavel and chain of office, Senator Vance and his boats, Senator Ruiz and her one white paper, Senator Howe asleep and Senator Bell with her hardware wallet, question a witness seen only as a hoodie from behind while the round multiplier climbs, the stenographer's minutes stack up the wall, the sergeant at arms checks his watch, the page runs in with a longer and longer card, the bail applications bloom on the clerk's desk and the public gallery flips from PUBLIC to BID to one wallet address, until an accepted cash-out walks your seat out of the gallery or the crash buzzes DEV SOLD, turns the gallery REKT, pulls the minutes off the wall, makes the gavel miss and leaves the hoodie empty on the chair."></canvas></div>
    <div class="controls">
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out · take my minute</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
