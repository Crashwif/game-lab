<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo Man — Game Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <!-- Keep the labelled canvas and control IDs: the shared shell uses them. -->
    <div class="stage"><canvas aria-label="A suburban cul-de-sac at 4:07 am where Gary, a polite repo man with a clipboard, a thermos and a reflector vest, works through a loan checklist as the round multiplier climbs, hooking the leased lime supercar, winching it onto his flatbed and stacking the hose, the TV, the kid’s bike with a bow on it, the smart fridge, the mailbox, the house numbers, the modular porch and the gutters into a tower longer than his truck, while the owner watches through the blinds over a laptop chart that stays green; a confirmed cash-out sends the owner downstairs in his socks to buy it all back and shake on it, and a crash turns on the four amber beacons, turns the chart red and sends Gary down the block with the front door seatbelted in the passenger seat."></canvas></div>
    <div class="controls">
      <div class="info">
        <p id="status" role="status">Connecting…</p>
        <p id="readout"></p>
      </div>
      <button id="bet" aria-disabled="true" aria-keyshortcuts="Space">Join round · 50 credits</button>
      <button id="cashout" aria-disabled="true" aria-keyshortcuts="Space">Cash out · buy it all back</button>
      <button id="restart" hidden>Replay round</button>
      <button id="sound" class="secondary">Sound: off</button>
      <p id="notice" role="alert" hidden></p>
    </div>
  </main>
  <script src="./game.generated.js" defer></script>
</body>
</html>
